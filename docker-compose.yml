services:
  mysql:
    image: mysql:8
    container_name: task_management_mysql
    restart: unless-stopped
    ports:
      - '3308:3306'
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: task_management
    volumes:
      - task_management_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pdevroot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  task_management_mysql_data:
